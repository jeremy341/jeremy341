name: Refresh profile terminal

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/profile_data.json"
      - "scripts/render_profile.py"
      - "scripts/update_profile_cache.py"
      - "tests/test_render_profile.py"
      - "tests/test_update_profile_cache.py"
      - "tests/test_workflow_schedule.py"
      - ".github/workflows/refresh-profile.yml"
  schedule:
    - cron: "0 10,15,20 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Render terminal cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile.py
      - name: Update profile cache versions
        run: python scripts/update_profile_cache.py
      - name: Commit refreshed assets
        run: |
          git config user.name "jeremy341-profile-bot"
          git config user.email "jeremy341-profile-bot@users.noreply.github.com"
          git add -A assets README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "$(git log -1 --pretty=%s)" = "chore: refresh profile terminal" ]; then
            git commit --amend --no-edit
            git push --force-with-lease
          else
            git commit -m "chore: refresh profile terminal"
            git push
          fi
