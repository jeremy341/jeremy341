name: Refresh profile terminal

on:
  push:
    branches: [main]
    paths:
      - "scripts/render_profile.py"
      - ".github/workflows/refresh-profile.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render terminal cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_GH_TOKEN: ${{ secrets.PROFILE_GH_TOKEN }}
          HACKATIME_ACCESS_TOKEN: ${{ secrets.HACKATIME_ACCESS_TOKEN }}
          HACKATIME_API_KEY: ${{ secrets.HACKATIME_API_KEY }}
        run: python scripts/render_profile.py
      - name: Commit refreshed assets
        run: |
          git config user.name "jeremy341-profile-bot"
          git config user.email "jeremy341-profile-bot@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "$(git log -1 --pretty=%s)" = "chore: refresh profile terminal" ]; then
            git commit --amend --no-edit
            git push --force-with-lease
          else
            git commit -m "chore: refresh profile terminal"
            git push
          fi
