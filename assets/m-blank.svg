<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1" viewBox="0 0 1 1" role="img" aria-labelledby="title"><title id="title">blank</title><style>.blink{opacity:0;animation:blink 4.2s steps(1) infinite}@keyframes blink{0%{opacity:0}92%{opacity:1}97%{opacity:0}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}.drift{animation:drift 14s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(46px)}}@media (prefers-reduced-motion:reduce){.blink,.bob,.drift{animation:none}}</style></svg>
